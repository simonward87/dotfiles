# https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd#font
[font]
size = 15

[font.normal]
family = "JetBrainsMono NF"
style = "Regular"

[font.bold]
family = "JetBrainsMono NF"
style = "Bold"

[font.italic]
family = "JetBrainsMono NF"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NF"
style = "Bold Italic"

[font.offset]
x = 0
y = 0
